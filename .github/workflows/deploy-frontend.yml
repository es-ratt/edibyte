name: Deploy web app to GitHub Pages

# Builds the PWA in /frontend (the previous app is archived in /legacy-frontend and not deployed).
# Without the VITE_API_BASE_URL repository variable the site runs in demo mode: the full flow works
# in the browser on the same data files as the API (backend/data/*.csv), with a "Demo data" banner.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/data/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          # Mock data only while no backend URL is set; set VITE_USE_MOCK_DATA to override.
          VITE_USE_MOCK_DATA: ${{ vars.VITE_USE_MOCK_DATA || (vars.VITE_API_BASE_URL && 'false' || 'true') }}
        run: |
          pnpm exec tsc -b
          pnpm exec vite build --base=/edibyte/
          # SPA fallback: deep links like /edibyte/capture load the app instead of a 404 page.
          cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
