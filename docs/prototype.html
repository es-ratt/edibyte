V.foods=()=>`<h1>Foods</h1><p class="m">${FOODS.length} everyday foods. Values are approximate, per household serving.</p><input data-in="q" value="${esc(ui.q)}" placeholder="Search foods (English or বাংলা)"><select data-ch="cat" style="margin:10px 0" aria-label="Category"><option value="">All categories</option>${[...new Set(FOODS.map(f=>f.cat))].map(c=>`<option value="${c}" ${ui.cat==c?"selected":""}>${c.replace("_"," ")}</option>`).join("")}</select><div id="fl">${fl()}</div>`;
const ALI={dahi:"yogurt|curd",chola:"chickpea|chana",brice:"brown rice",chingri:"prawn|shrimp",khich:"khichuri|khichdi",peanut:"nuts|groundnut",mixveg:"vegetables",begun:"eggplant|brinjal",rui:"rohu",pangas:"pangash",omelet:"omelette",jhal:"jhalmuri",pumpkin:"kumra",masoor:"red lentil",mug:"moong",rice:"bhat|white rice",cha:"tea",lal:"lal shak"};
const hit=(f,s)=>new RegExp("\\b("+[f.id,ALI[f.id]].filter(Boolean).join("|")+")\\b","i").test(s)||s.includes(f.bn);
const line=f=>`${f.en} (${f.bn}), ${f.sv}: ${f.kcal} kcal, ${f.p} g protein, ${f.fib} g fibre, ${f.na} mg sodium${f.gi?", GI "+f.gi:""}.`;
function coach(q){const s=q.toLowerCase(),t=S.p.t,fs=FOODS.filter(f=>hit(f,s)).slice(0,3);let a,src=[],fu=[];
if(fs.length>1){src=fs;a=fs.map(line).join(" ");const hp=[...fs].sort((x,y)=>y.p-x.p)[0],ls=[...fs].sort((x,y)=>x.na-y.na)[0];a+=` Most protein per serving: ${hp.en}. Lowest sodium: ${ls.en}.`;fu=["Which foods are high in fibre?","What can I eat for more protein?"]}
else if(fs.length){const f=fs[0];src=[f];a=line(f)+` That is ${r0(f.kcal/t.kcal*100)}% of your daily calories, ${r0(f.p/t.prot*100)}% of your protein target and ${r0(f.na/t.na*100)}% of your ${t.na} mg sodium limit.`;if(f.al.some(x=>S.p.alg.includes(x)))a+=" It contains an allergen you listed, so avoid it.";if(/salty/.test(f.t))a+=" It is very salty, so keep it occasional.";fu=["Compare "+f.en.split(" ")[0]+" and egg","Which foods are low in sodium?"]}
else{const m={protein:["p",1],fibre:["fib",1],fiber:["fib",1],sodium:["na",1],salt:["na",1],gi:["gi",0],glycemic:["gi",0],sugar:["gi",0]},k=Object.keys(m).find(x=>s.includes(x));
if(k){const[key,desc]=m[k],l=FOODS.filter(f=>okf(f)&&f.cat!="condiment"&&(key!="gi"||f.gi)&&(key!="na"||f.na>0)&&!(key=="p"&&f.cat=="sweet")).sort((x,y)=>desc?y[key]-x[key]:x[key]-y[key]).slice(0,5);src=l;
a=(key=="na"?"Highest in sodium, so watch these (per serving): ":key=="gi"?"Lowest glycaemic index (steadier blood sugar): ":key=="fib"?"Most fibre per serving: ":"Most protein per serving: ")+l.map(f=>`${f.en} ${f[key]}${key=="gi"?"":key=="na"?" mg":" g"}`).join(", ")+".";
a+=key=="p"?` Your daily target is ${t.prot} g.`:key=="fib"?` Your daily target is ${t.fib} g.`:key=="na"?` Your daily limit is ${t.na} mg.`:"";fu=["Compare rui and chicken","How much protein is in dal?"]}
else{a="I can only answer from the EdiByte food dataset. Try naming a food, comparing two foods, or asking which foods are high in protein, fibre or sodium.";fu=["Which foods are high in protein?","Compare masoor dal and chola","Which foods are high in sodium?"]}}
return{r:"c",t:a,src:src.map(f=>f.en),fu,cau:"Educational guidance, not medical advice."+(S.p.conds.length?" Check changes with your clinician.":"")}}
V.coach=()=>`<h1>Coach</h1><p class="m">Answers come only from the food dataset, using household portions.</p>${GUIDE}${S.chat.map(m=>m.r=="u"?`<div class="bub u">${esc(m.t)}</div>`:`<div class="bub a">${esc(m.t)}${m.src.length?`<div class="m" style="margin-top:6px">Foods used: ${m.src.map(esc).join(", ")}</div>`:""}<div>${m.fu.map(x=>`<button class="chip" data-a="ask" data-x="${esc(x)}">${esc(x)}</button>`).join("")}</div><div class="note">${m.cau}</div></div>`).join("")}${ui.think?'<div class="bub a m">Thinking…</div>':""}
${S.chat.length?"":["Which foods are high in protein?","Compare rui and chicken","Is shutki okay for me?"].map(x=>`<button class="chip" data-a="ask" data-x="${x}">${x}</button>`).join("")}<form data-f="ask" style="display:flex;gap:8px;margin-top:14px"><input id="cq" name="q" placeholder="Ask about a food" required><button class="btn">Ask</button></form>`;
const spark=(a,u)=>{if(a.length<2)return'<div class="m">Add two or more readings to see a trend.</div>';const mn=Math.min(...a),mx=Math.max(...a),pts=a.map((v,i)=>`${i/(a.length-1)*300},${62-(v-mn)/((mx-mn)||1)*54}`).join(" ");return`<svg viewBox="0 0 300 70" width="100%" height="70" role="img" aria-label="Trend"><polyline points="${pts}" fill="none" stroke="var(--pri)" stroke-width="3" stroke-linejoin="round"/></svg><div class="m">${a[0]} to ${a[a.length-1]} ${u}</div>`};
const col=k=>S.vit.map(v=>v[k]).filter(x=>x!=null),avg=a=>a.reduce((s,x)=>s+x,0)/(a.length||1);
V.out=()=>{const w=col("w"),sy=col("sys").slice(-5),di=col("dia").slice(-5),fg=col("fg"),pp=col("pp"),td=today(),d14=new Set(S.logs.filter(l=>l.date>addD(td,-14)).map(l=>l.date)).size,pm=S.plan.days.flat(),sm=[];
if(w.length>1)sm.push(`Weight moved ${r1(w[w.length-1]-w[0])} kg since your first reading. Target is ${S.p.tw} kg (${r1(w[w.length-1]-S.p.tw)} kg to go).`);

return`<h1>Outcomes</h1>${GUIDE}<div class="c"><h3>Record readings</h3><form data-f="vit"><div class="g"><div><label>Date</label><input name="date" type="date" value="${td}"></div>${fi("Weight (kg)","w")}${fi("BP systolic","sys")}${fi("BP diastolic","dia")}${fi("Fasting glucose (mg/dL)","fg")}${fi("Post-meal glucose (mg/dL)","pp")}${fi("Waist (cm)","wa")}</div><br><button class="btn">Save readings</button></form></div>
<div class="c"><h3>Summary</h3>${sm.map(x=>`<p>${x}</p>`).join("")||'<p class="m">Save a few readings to see plain-language summaries.</p>'}<p class="m">Logged ${d14} of the last 14 days. ${r0(pm.filter(m=>m.done).length/pm.length*100)}% of planned meals logged.</p></div>
<div class="g"><div class="c"><h3>Weight</h3>${spark(w,"kg")}</div><div class="c"><h3>Systolic BP</h3>${spark(col("sys"),"mmHg")}</div><div class="c"><h3>Fasting glucose</h3>${spark(fg,"mg/dL")}</div><div class="c"><h3>Post-meal glucose</h3>${spark(pp,"mg/dL")}</div></div>`};
const chk=(n,o,s=[])=>`<div class="chk">${o.map(([v,l])=>`<label><input type="checkbox" name="${n}" value="${v}" ${s.includes(v)?"checked":""}>${l}</label>`).join("")}</div>`,sl=(n,o,v)=>`<select name="${n}">${o.map(([a,b])=>`<option value="${a}" ${String(a)==String(v)?"selected":""}>${b}</option>`).join("")}</select>`;
V.ob=()=>{const p=S.p||{goals:[],conds:[],alg:[]},fi=(l,n,t="number",v=p[n],x="required")=>`<div><label>${l}</label><input name="${n}" type="${t}" step="any" value="${esc(v)}" ${x}></div>`;
return`<h1>${S.p?"Edit profile":"Welcome to EdiByte"}</h1><p class="m">Personalized nutrition from everyday Bangladeshi foods. Takes about two minutes. Your data stays in this browser.</p><form data-f="ob" class="c"><div class="g">${fi("Age","age")}<div><label>Sex</label>${sl("sex",[["f","Female"],["m","Male"]],p.sex)}</div>${fi("Height (cm)","h")}${fi("Weight (kg)","w")}${fi("Target weight (kg)","tw")}<div><label>Activity</label>${sl("act",[["sed","Sedentary"],["light","Light"],["mod","Moderate"],["act","Active"]],p.act||"light")}</div></div>
<label>Goals</label>${chk("goals",[["loss","Weight loss"],["muscle","Muscle gain"],["diab","Manage diabetes"],["heart","Heart health"],["preg","Pregnancy"]],p.goals)}<label>Conditions</label>${chk("conds",[["t2d","Type 2 diabetes"],["pre","Prediabetes"],["htn","Hypertension"],["chol","High cholesterol"],["pcos","PCOS"],["ckd","CKD"]],p.conds)}<label>Allergies and intolerances</label>${chk("alg",[["lactose","Lactose"],["gluten","Gluten"],["nuts","Nuts"],["shellfish","Shellfish"],["egg","Egg"],["soy","Soy"],["fish","Fish"]],p.alg)}
<div class="g"><div><label>Diet pattern</label>${sl("diet",[[4,"Omnivore"],[3,"Pescatarian"],[2,"Eggetarian"],[1,"Vegetarian"],[0,"Vegan"]],p.diet??4)}</div><div><label>Region</label>${sl("reg",["Dhaka","Chattogram","Sylhet","Rajshahi","Khulna","Barishal","Rangpur","Mymensingh"].map(x=>[x,x]),p.reg)}</div>${fi("City","city","text",p.city,"")}${fi("Household size","hh","number",p.hh||4)}${fi("Monthly food budget (৳)","bud","number",p.bud||15000)}${fi("Cooking time (min)","cook","number",p.cook||45)}<div><label>Spice</label>${sl("spice",[["mild","Mild"],["medium","Medium"],["hot","Hot"]],p.spice||"medium")}</div></div>
<div class="chk"><label><input type="checkbox" name="rice" ${p.rice?"checked":""}>Rice at every meal</label><label><input type="checkbox" name="fast" ${p.fast?"checked":""}>I observe fasting</label></div><label>Disliked foods (comma separated)</label><input name="dis" value="${esc(p.dis)}"><label>Notes</label><textarea name="notes" rows="2">${esc(p.notes)}</textarea><br><button class="btn">Save and build my plan</button></form>`};
V.profile=()=>{const p=S.p,t=p.t;return`<h1>Profile</h1><div class="c"><h3>Your daily targets</h3>${[["Calories",t.kcal+" kcal"],["Protein",t.prot+" g"],["Carbohydrate",t.carb+" g"],["Fat",t.fat+" g"],["Fibre",t.fib+" g"],["Sodium limit",t.na+" mg"]].map(([a,b])=>`<div class="r"><span>${a}</span><b>${b}</b></div>`).join("")}<p class="m">Mifflin-St Jeor energy needs, adjusted for your goals and conditions.</p></div><div class="c"><h3>About you</h3><p class="m">${p.age} years, ${p.h} cm, ${p.w} kg, target ${p.tw} kg. ${p.city?esc(p.city)+", ":""}${p.reg}. Household ${p.hh}.</p><button class="btn" data-a="edit">Edit profile</button> <button class="btn o" data-a="regen">Rebuild plan</button> <button class="btn o" data-a="reset">Reset all data</button></div>${GUIDE}`};
const TB=[["today","Today","🏠"],["plan","Plan","📅"],["log","Log","✍️"],["foods","Foods","🍛"],["coach","Coach","💬"],["outcomes","Outcomes","📈"],["profile","Profile","👤"]];

logp:(d,s)=>{const m=S.plan.days[d].find(x=>x.s==s);if(m.done)return;m.done=1;const x=mac(m.ps);S.logs.push({id:Math.random().toString(36).slice(2),date:addD(S.plan.start,+d),slot:s,src:"plan",pd:+d,n:nm(m.ps,"en"),b:nm(m.ps,"bn"),...x});save();render()},
