# Render blueprint: backend web service + frontend static site.
# Set the secret env vars (DATABASE_URL, LLM_API_KEY) in the Render dashboard.
services:
  - type: web
    name: edibyte-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        value: none
      - key: LLM_MODEL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://edibyte-web.onrender.com
      - key: ENABLE_PHOTO
        value: "false"
  - type: web
    name: edibyte-web
    runtime: static
    rootDir: frontend
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://edibyte-api.onrender.com
