# Render blueprint for the backend API. Render watches this GitHub repo and redeploys on
# every push to main. The frontend is deployed separately to GitHub Pages
# (.github/workflows/deploy-frontend.yml).
#
# Works with no secrets: offline mode (rules engine + BM25 coach) and SQLite seeded from
# backend/data on every start. Optional, added later in the Render dashboard:
#   DATABASE_URL  PostgreSQL URL, so anonymous meal history survives restarts
#   LLM_PROVIDER / LLM_MODEL / LLM_API_KEY  AI mode
services:
  - type: web
    name: edibyte-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LLM_PROVIDER
        value: none
      # Origins only (no path). The GitHub Pages site plus local development.
      - key: CORS_ORIGINS
        value: https://es-ratt.github.io,http://localhost:5173
      - key: ENABLE_PHOTO
        value: "false"
      # Render sits in front of the app and sets X-Forwarded-For itself.
      - key: TRUST_PROXY
        value: "true"
